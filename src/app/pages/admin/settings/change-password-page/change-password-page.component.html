<div class="max-w-full mx-auto">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-slate-900">Account security</h1>
    <p class="text-slate-500">Update your password to keep your account secure.</p>
  </div>

  <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="p-6 sm:p-8 max-w-[700px]">
      <app-change-password-form #changePasswordForm></app-change-password-form>

      <div class="pt-4 flex flex-col sm:flex-row gap-3">
        <button matButton="filled" color="primary" type="button" class="flex-1"
          [disabled]="networkActive()"
          (click)="changePasswordEvent()">
          @if (networkActive()) {
          <div class="flex items-center justify-center gap-2">
            <mat-spinner diameter="20" color="accent"></mat-spinner>
            <span>Updating...</span>
          </div>
          } @else {
          <span>Update Password</span>
          }
        </button>
        <button matButton="outlined" type="button" class="flex-1">Cancel</button>
      </div>
    </div>

    <div class="bg-slate-50 border-t border-slate-200 p-4 flex items-start gap-3">
      <p class="text-xs text-slate-500">
        Changing your password will close all active sessions on other devices to ensure the security of your account.
      </p>
    </div>
  </div>
</div>
