<div class="w-full mx-auto px-4 py-6 md:py-8 pb-24 md:pb-12">

  <div class="flex flex-wrap lg:flex-row lg:items-end justify-between gap-6 mb-8 md:mb-12">
    <div class="space-y-1">
      <h1 class="text-3xl md:text-4xl font-black text-slate-900 tracking-tight">Catalog 🧸</h1>
      <p class="text-slate-500 text-base md:text-lg">Curated collection of fun.</p>
    </div>

    <div class="flex flex-wrap justify-end gap-2 w-full lg:w-auto">
      <div class="relative w-2/3 flex-none sm:flex-1 lg:flex-none lg:w-80">
        <span class="absolute inset-y-0 left-4 flex items-center text-slate-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </span>
        <input type="text"
          class="w-full bg-white border-2 border-slate-100 rounded-2xl py-3 pl-11 pr-4 focus:ring-4 focus:ring-indigo-50 focus:border-indigo-600 transition-all text-base md:text-sm font-medium outline-none"
          placeholder="What toy are you looking for?">
      </div>

      <button (click)="toggleFilters()"
        class="bg-slate-900 text-white px-4 md:px-6 py-3 rounded-2xl font-bold hover:bg-indigo-600 transition-all flex items-center justify-center gap-2 shadow-xl shadow-slate-200 active:scale-95">
        <svg class="w-6 h-6 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
        </svg>
        <span class="hidden sm:inline">Filters</span>
      </button>
    </div>
  </div>

  <div class="flex flex-wrap gap-3 overflow-x-auto pb-6 -mx-4 px-4 no-scrollbar scroll-smooth snap-x">
    <button class="snap-start whitespace-nowrap px-5 py-2.5 rounded-full bg-white border border-slate-200 text-slate-600 font-bold text-sm hover:border-indigo-600 hover:text-indigo-600 transition-all active:bg-indigo-50 cursor-pointer">
        All Categories
    </button>
    @for (cat of categories(); track cat.id) {
      <button class="snap-start whitespace-nowrap px-5 py-2.5 rounded-full bg-white border border-slate-200 text-slate-600 font-bold text-sm hover:border-indigo-600 hover:text-indigo-600 transition-all active:bg-indigo-50 cursor-pointer">
        {{ cat.name }}
      </button>
    }
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6">
    @for (toy of toyItems(); track toy.id) {
    <app-toy-view-on-search [toyData]="toy">
    </app-toy-view-on-search>
    }
  </div>
</div>

<div *ngIf="isFilterOpen" class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center">
  <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" (click)="toggleFilters()"></div>

  <div
    class="relative bg-white w-full max-w-md rounded-t-[2.5rem] sm:rounded-[3rem] p-6 md:p-8 shadow-2xl animate-in slide-in-from-bottom sm:zoom-in duration-300 max-h-[90vh] overflow-y-auto">

    <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6 sm:hidden"></div>

    <div class="flex justify-between items-center mb-6 md:mb-8">
      <h2 class="text-xl md:text-2xl font-black text-slate-900">Ajustes de Filtro</h2>
      <button (click)="toggleFilters()" class="p-2 bg-slate-50 hover:bg-slate-100 rounded-full transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="space-y-6 md:space-y-8">
      <div>
        <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-4 block">Rango de
          Precio</label>
        <input type="range" class="w-full h-2 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-indigo-600">
        <div class="flex justify-between mt-3 text-sm font-bold text-slate-600">
          <span>$0</span>
          <span>$250+</span>
        </div>
      </div>

      <div>
        <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-4 block">Edad</label>
        <div class="grid grid-cols-2 gap-2">
          <button *ngFor="let age of ['0-3', '4-7', '8-12', '13+']"
            class="py-3 rounded-xl border-2 border-slate-50 text-sm font-bold text-slate-600 active:border-indigo-600 focus:border-indigo-600 transition-all">
            {{age}} años
          </button>
        </div>
      </div>

      <button (click)="toggleFilters()"
        class="w-full bg-indigo-600 text-white py-4 md:py-5 rounded-2xl md:rounded-3xl font-black shadow-lg shadow-indigo-100 hover:bg-indigo-700 active:scale-[0.98] transition-all">
        Aplicar Filtros
      </button>
    </div>
  </div>
</div>
