<div *transloco="let t" class="w-full mx-auto px-4 py-6 md:py-8 pb-24 md:pb-12">
  <div class="flex flex-wrap lg:flex-row lg:items-end justify-between gap-6 mb-8 md:mb-12">
    <div class="flex flex-row items-center justify-between gap-4">
      <div class="flex flex-col">
        <h1 class="text-3xl md:text-4xl font-black text-slate-900 tracking-tight">{{ t('searchToyPage.Catalog') }}</h1>
        <p class="text-slate-500 text-base md:text-lg">{{ t('searchToyPage.Curated collection of fun') }}</p>
      </div>

      <button class="w-fit p-4 rounded-2xl border-2 border-dashed border-slate-200 flex flex-col items-center justify-center text-slate-400 hover:bg-slate-50 hover:border-indigo-300 hover:text-indigo-500 transition-all cursor-pointer"
        *hasPermission [disabled]="networkActive()" (click)="addNewItemEvent()">
        <mat-icon class="w-6 h-6 mb-1" svgIcon="plus"></mat-icon>
        <span class="text-[10px] font-bold uppercase tracking-tight">{{ t('searchToyPage.Add New Toy') }}</span>
      </button>
    </div>

    <app-search-toy-filter-form #searchToyFilter
      (filterDataChanged)="onFilterChange($event)">
    </app-search-toy-filter-form>
  </div>

  <div class="flex flex-wrap gap-3 overflow-x-auto pb-6 -mx-4 px-4 no-scrollbar scroll-smooth snap-x">
    <button class="snap-start whitespace-nowrap px-5 py-2.5 rounded-full bg-white border border-slate-200 text-slate-600 font-bold text-sm hover:border-indigo-600 hover:text-indigo-600 transition-all active:bg-indigo-50 cursor-pointer"
      [ngClass]="{ '!border-indigo-600 !text-indigo-600': !catIdSelected() }"
      (click)="onCategoryChange('')">
        {{ t('global.buttons.All') }}
    </button>
    @for (cat of categories(); track cat.id) {
      <button class="snap-start whitespace-nowrap px-5 py-2.5 rounded-full bg-white border border-slate-200 text-slate-600 font-bold text-sm hover:border-indigo-600 hover:text-indigo-600 transition-all active:bg-indigo-50 cursor-pointer"
        [ngClass]="{ '!border-indigo-600 !text-indigo-600': catIdSelected() === cat.id }"
        (click)="onCategoryChange(cat.id)">
        {{ cat.name }}
      </button>
    }
  </div>

  <app-search-toy-list #searchToyList
    [networkActive]="this.toySearchHelperService.loading()"
    [items]="this.toySearchHelperService.searchData()"
    [totalItems]="this.toySearchHelperService.totalCount()"
    (pagingChange)="onPagingChange($event)">
  </app-search-toy-list>
</div>
