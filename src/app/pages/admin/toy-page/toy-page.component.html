<div
  class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-8 flex flex-wrap items-center justify-between gap-4">
  <div class="flex items-center gap-4">
    <div class="relative">
      <select
        class="appearance-none bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-4 py-2 pr-8 focus:ring-2 focus:ring-indigo-600 outline-none transition-all">
        <option>Todas las categorías</option>
        <option>Educativos</option>
        <option>Acción</option>
        <option>Peluches</option>
      </select>
      <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none text-slate-400">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M19 9l-7 7-7-7" />
        </svg>
      </div>
    </div>

    <div class="flex items-center gap-2 text-sm text-slate-500">
      <span>Mostrar:</span>
      <select class="bg-transparent font-bold text-slate-900 outline-none">
        <option>12</option>
        <option>24</option>
        <option>48</option>
      </select>
    </div>
  </div>

  <div class="text-sm text-slate-500">
    Mostrando <span class="font-bold text-slate-900">1-12</span> de <span class="font-bold text-slate-900">120</span>
    productos
  </div>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mb-10">

  <div
    class="group bg-white rounded-3xl border border-slate-200 shadow-sm hover:shadow-xl hover:shadow-indigo-100 transition-all overflow-hidden flex flex-col">
    <div class="relative aspect-square overflow-hidden bg-slate-100">
      <button
        class="absolute top-4 right-4 z-10 p-2 bg-white/80 backdrop-blur-md rounded-full text-slate-400 hover:text-pink-500 hover:scale-110 transition-all shadow-sm">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
          <path
            d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.5 3c1.557 0 3.046.711 4 1.99C12.454 3.711 13.943 3 15.5 3c2.786 0 5.25 2.322 5.25 5.25 0 3.925-2.438 7.111-4.73 9.271a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001z" />
        </svg>
      </button>

      <img src="https://images.unsplash.com/photo-1558060370-d644479cb6f7?auto=format&fit=crop&q=80&w=500"
        alt="Robot de juguete"
        class="w-full h-full object-cover group-hover:scale-110 transition-duration-500 transition-all">
    </div>

    <div class="p-5 flex flex-col flex-1">
      <div class="flex justify-between items-start mb-2">
        <h3 class="font-bold text-slate-900 group-hover:text-indigo-600 transition-colors">Robot Interactivo Z-1</h3>
        <span class="text-xs font-bold px-2 py-1 bg-green-100 text-green-600 rounded-lg">Nuevo</span>
      </div>
      <p class="text-slate-500 text-sm mb-4 line-clamp-2">Robot inteligente con luces LED y control por voz para niños.
      </p>

      <div class="mt-auto flex items-center justify-between">
        <div>
          <span class="text-xs text-slate-400 block uppercase font-bold tracking-tighter">Precio</span>
          <span class="text-xl font-black text-slate-900">$45.00</span>
        </div>
        <button
          class="bg-slate-900 text-white p-3 rounded-2xl hover:bg-indigo-600 transition-all shadow-lg shadow-slate-200">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>


<div class="flex items-center justify-center gap-2 py-8">
  <button
    class="p-2 rounded-xl border border-slate-200 text-slate-400 hover:bg-white hover:text-indigo-600 transition-all">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path d="M15 19l-7-7 7-7" />
    </svg>
  </button>

  <button class="w-10 h-10 rounded-xl bg-indigo-600 text-white font-bold shadow-lg shadow-indigo-200">1</button>
  <button
    class="w-10 h-10 rounded-xl bg-white border border-slate-200 text-slate-600 font-bold hover:border-indigo-600 transition-all">2</button>
  <button
    class="w-10 h-10 rounded-xl bg-white border border-slate-200 text-slate-600 font-bold hover:border-indigo-600 transition-all">3</button>
  <span class="text-slate-400 mx-1">...</span>
  <button
    class="w-10 h-10 rounded-xl bg-white border border-slate-200 text-slate-600 font-bold hover:border-indigo-600 transition-all">10</button>

  <button
    class="p-2 rounded-xl border border-slate-200 text-slate-400 hover:bg-white hover:text-indigo-600 transition-all">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path d="M9 5l7 7-7 7" />
    </svg>
  </button>
</div>
