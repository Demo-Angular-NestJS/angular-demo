<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4 md:p-8">
  <div class="max-w-5xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row">

    <div class="hidden md:flex md:w-1/2 bg-indigo-600 relative overflow-hidden items-center justify-center p-12">
      <div class="absolute top-0 right-0 w-64 h-64 bg-indigo-500 rounded-full -mr-20 -mt-20 opacity-50"></div>
      <div class="absolute bottom-0 left-0 w-40 h-40 bg-yellow-400 rounded-full -ml-10 -mb-10 opacity-80"></div>

      <div class="relative z-10 text-white">
        <h2 class="text-4xl font-bold mb-4">Donde los sueños cobran vida.</h2>
        <p class="text-indigo-100 text-lg">Únete a nuestra comunidad y descubre ofertas exclusivas en las mejores marcas
          de juguetes.</p>

        <div class="mt-10 flex justify-center">
          <svg class="w-48 h-48 text-yellow-300 drop-shadow-lg" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z" />
          </svg>
        </div>
      </div>
    </div>

    <div class="w-full md:w-1/2 p-8 lg:p-16">
      <div class="flex justify-between items-center mb-8">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
            <span class="text-white font-bold text-xl">T</span>
          </div>
          <span class="text-xl font-bold tracking-tight text-slate-800">ToyStore</span>
        </div>
        <a href="#" class="text-sm font-semibold text-indigo-600 hover:text-indigo-500">Crear cuenta</a>
      </div>

      <h1 class="text-3xl font-bold text-slate-900 mb-2">¡Hola de nuevo!</h1>
      <p class="text-slate-500 mb-8">Ingresa tus datos para entrar a tu panel.</p>

      <form action="#" class="space-y-5">
        <div>
          <span class="block text-sm font-medium text-slate-700 mb-1">Correo electrónico</span>
          <input type="email" placeholder="ejemplo@correo.com"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-600 focus:border-transparent outline-none transition-all placeholder:text-slate-400">
        </div>

        <div>
          <div class="flex justify-between mb-1">
            <span class="text-sm font-medium text-slate-700">Contraseña</span>
            <a href="#" class="text-sm font-semibold text-indigo-600 hover:underline">¿La olvidaste?</a>
          </div>
          <input type="password" placeholder="••••••••"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-600 focus:border-transparent outline-none transition-all placeholder:text-slate-400">
        </div>

        <div class="flex items-center gap-2 py-2">
          <input type="checkbox" id="remember"
            class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-600">
          <span for="remember" class="text-sm text-slate-600">Mantener sesión iniciada</span>
        </div>

        <button type="button"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-indigo-200 transition-all transform active:scale-[0.98] cursor-pointer"
          (click)="signInEvent($event)">
          Iniciar Sesión
        </button>
      </form>

      <div class="mt-8">
        <div class="relative flex items-center mb-6">
          <div class="flex-grow border-t border-slate-200"></div>
          <span class="px-4 text-xs text-slate-400 uppercase tracking-widest">O continúa con</span>
          <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <button
            class="flex items-center justify-center gap-2 py-3 border border-slate-200 rounded-xl hover:bg-slate-50 transition-colors">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
            <span class="text-sm font-bold text-slate-700">Google</span>
          </button>
          <button
            class="flex items-center justify-center gap-2 py-3 border border-slate-200 rounded-xl hover:bg-slate-50 transition-colors">
            <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" class="w-5 h-5" alt="Facebook">
            <span class="text-sm font-bold text-slate-700">Facebook</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
