<div class="min-h-screen bg-slate-50 flex flex-col items-center justify-center font-sans text-slate-900 p-4 relative">

  <div class="absolute top-8 left-4 lg:left-8">
    <a [routerLink]="[searchSignInRoute]"
      class="flex items-center gap-2 text-slate-500 hover:text-indigo-600 font-semibold transition-all group">
      <div class="p-2 rounded-full group-hover:bg-indigo-50 transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
      </div>
      <span class="hidden sm:inline text-sm">Volver al login</span>
    </a>
  </div>

  <div class="max-w-md w-full">
    <div class="flex items-center justify-center gap-3 mb-8">
      <div
        class="w-9 h-9 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-xl flex items-center justify-center shadow-md shadow-indigo-100">
        <span class="text-white font-black text-lg">T</span>
      </div>
      <h2 class="text-xl font-extrabold tracking-tight text-slate-800">ToyStore</h2>
    </div>

    <div class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-xl shadow-slate-200/50">
      <div class="mb-6">
        <h1 class="text-2xl font-bold text-slate-900">Crear cuenta</h1>
        <p class="text-slate-400 text-sm">Únete a nuestra comunidad hoy mismo.</p>
      </div>

      <form action="#" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">Nombre</label>
          <input type="text" placeholder="Juan Pérez"
            class="w-full bg-slate-50 border border-slate-100 rounded-2xl py-3 px-4 focus:ring-2 focus:ring-indigo-600 focus:bg-white outline-none transition-all placeholder:text-slate-300 text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">Email</label>
          <input type="email" placeholder="juan@ejemplo.com"
            class="w-full bg-slate-50 border border-slate-100 rounded-2xl py-3 px-4 focus:ring-2 focus:ring-indigo-600 focus:bg-white outline-none transition-all placeholder:text-slate-300 text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">Contraseña</label>
          <input type="password" placeholder="••••••••"
            class="w-full bg-slate-50 border border-slate-100 rounded-2xl py-3 px-4 focus:ring-2 focus:ring-indigo-600 focus:bg-white outline-none transition-all placeholder:text-slate-300 text-sm">
        </div>

        <button type="submit"
          class="w-full bg-indigo-600 text-white py-3.5 rounded-2xl font-bold shadow-lg shadow-indigo-200 hover:bg-indigo-700 hover:-translate-y-0.5 transition-all active:scale-95 mt-4 text-sm">
          Registrarse
        </button>
      </form>
    </div>

    <p class="text-center mt-6 text-slate-400 text-xs">
      ¿Ya tienes una cuenta? <a [routerLink]="[searchSignInRoute]" class="text-indigo-600 font-bold hover:text-indigo-700">Inicia sesión</a>
    </p>
  </div>
</div>
