<div class="min-h-screen bg-slate-50 flex flex-col items-center justify-center font-sans text-slate-900 p-4 relative">

  <div class="absolute top-8 left-4 lg:left-8">
    <a [routerLink]="[searchSignInRoute]"
      class="flex items-center gap-2 text-slate-500 hover:text-indigo-600 font-semibold transition-all group">
      <div class="p-2 rounded-full group-hover:bg-indigo-50 transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
      </div>
      <span class="hidden sm:inline text-sm">Back to Login</span>
    </a>
  </div>

  <div class="max-w-md w-full">
    <div class="flex items-center justify-center gap-3 mb-8">
      <div
        class="w-9 h-9 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-xl flex items-center justify-center shadow-md shadow-indigo-100">
        <span class="text-white font-black text-lg">T</span>
      </div>
      <h2 class="text-xl font-extrabold tracking-tight text-slate-800">ToyStore</h2>
    </div>

    <div class="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-xl shadow-slate-200/50">
      <div class="mb-6">
        <h1 class="text-2xl font-bold text-slate-900">Create an account</h1>
        <p class="text-slate-400 text-sm">Join our community today.</p>
      </div>

      <app-register-form #registerForm
        [networkActive]="networkActive()"
        [errorMessage]="errorMessage()"
        (submitData)="registerEvent($event)">
      </app-register-form>
    </div>

    <p class="text-center mt-6 text-slate-400 text-xs">
      Do you already have an account? <a [routerLink]="[searchSignInRoute]" class="text-indigo-600 font-bold hover:text-indigo-700">Sign In</a>
    </p>
  </div>
</div>
