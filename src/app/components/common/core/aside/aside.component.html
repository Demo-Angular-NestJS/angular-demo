<aside class="fixed flex flex-col bg-white border-r border-slate-200 transition-all duration-300 h-full z-50 lg:w-64 md:w-15 lg:z-20"
  [ngClass]="isAsidebarOpen() ? 'min-w-64 translate-x-0' : '-translate-x-full md:translate-x-0'">
  <div class="p-4">
    <p class="lg:inline hidden flex items-center gap-2 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4"
      [ngClass]="isAsidebarOpen() ? 'inline' : 'hidden'">
      Catálogo
    </p>

    <ul class="space-y-2">
      <li [ngClass]="(currentRoute() === searchHomeRoute) ? 'bg-indigo-50 text-indigo-700': 'text-slate-600 hover:bg-slate-50'">
        <a class="flex items-center gap-3 px-3 py-2 text-slate-600 hover:bg-slate-50 rounded-xl transition-all md:justify-center lg:justify-start"
          [ngClass]="isAsidebarOpen() ? 'md:justify-start' : 'md:justify-center'"
          [routerLink]="[searchHomeRoute]"
          (click)="closeAsidebar()">
          <mat-icon class="w-6 h-6 flex-shrink-0 !text-indigo-600" svgIcon="home"></mat-icon>
          <span class="font-medium lg:block" [ngClass]="isAsidebarOpen() ? 'display' : 'hidden'">
            Home
          </span>
        </a>
      </li>

      <li [ngClass]="(currentRoute() === searchToyRoute) ? 'bg-indigo-50 text-indigo-700': 'text-slate-600 hover:bg-slate-50'">
        <a class="flex items-center gap-3 px-3 py-2 text-slate-600 hover:bg-slate-50 rounded-xl transition-all md:justify-center lg:justify-start"
          [ngClass]="isAsidebarOpen() ? 'md:justify-start' : 'md:justify-center'"
          [routerLink]="[searchToyRoute]"
          (click)="closeAsidebar()">
          <mat-icon class="w-6 h-6 flex-shrink-0 !text-indigo-600" svgIcon="toy"></mat-icon>
          <span class="font-medium lg:block" [ngClass]="isAsidebarOpen() ? 'display' : 'hidden'"> Toys</span>
        </a>
      </li>

      <li [ngClass]="(currentRoute() === searchFavoriteRoute) ? 'bg-indigo-50 text-indigo-700': 'text-slate-600 hover:bg-slate-50'">
        <a class="flex items-center gap-3 px-3 py-2 text-slate-600 hover:bg-slate-50 rounded-xl transition-all md:justify-center lg:justify-start"
          [ngClass]="isAsidebarOpen() ? 'md:justify-start' : 'md:justify-center'"
          [routerLink]="[searchFavoriteRoute]"
          (click)="closeAsidebar()">
          <mat-icon class="w-6 h-6 flex-shrink-0 !text-indigo-600" svgIcon="favorite"></mat-icon>
          <span class="font-medium lg:block" [ngClass]="isAsidebarOpen() ? 'display' : 'hidden'"> Favorites</span>
        </a>
      </li>
    </ul>
  </div>

  <div class="p-4">
    <p class="lg:inline hidden flex items-center gap-2 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4"
      [ngClass]="isAsidebarOpen() ? 'inline' : 'hidden'">
      My Account
    </p>

    <ul class="space-y-2">
      <li [ngClass]="(currentRoute() === searchMyPurchaseRoute) ? 'bg-indigo-50 text-indigo-700': 'text-slate-600 hover:bg-slate-50'">
        <a class="flex items-center gap-3 px-3 py-2 text-slate-600 hover:bg-slate-50 rounded-xl transition-all md:justify-center lg:justify-start"
          [ngClass]="isAsidebarOpen() ? 'md:justify-start' : 'md:justify-center'"
          [routerLink]="[searchMyPurchaseRoute]"
          (click)="closeAsidebar()">
          <mat-icon class="w-6 h-6 flex-shrink-0 !text-indigo-600" svgIcon="settings"></mat-icon>
          <span class="font-medium lg:block" [ngClass]="isAsidebarOpen() ? 'display' : 'hidden'"> My purchases</span>
        </a>
      </li>

      <li [ngClass]="(currentRoute() === searchSettingRoute) ? 'bg-indigo-50 text-indigo-700': 'text-slate-600 hover:bg-slate-50'">
        <a class="flex items-center gap-3 px-3 py-2 text-slate-600 hover:bg-slate-50 rounded-xl transition-all md:justify-center lg:justify-start"
          [ngClass]="isAsidebarOpen() ? 'md:justify-start' : 'md:justify-center'"
          [routerLink]="[searchSettingRoute]"
          (click)="closeAsidebar()">
          <mat-icon class="w-6 h-6 flex-shrink-0 !text-indigo-600" svgIcon="settings"></mat-icon>
          <span class="font-medium lg:block" [ngClass]="isAsidebarOpen() ? 'display' : 'hidden'"> Settings</span>
        </a>
      </li>
    </ul>
  </div>
</aside>
