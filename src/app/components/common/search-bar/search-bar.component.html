<div class="hidden md:flex flex-1 relative w-full" #searchContainer>
  <div class="relative w-full">
    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
      <mat-icon class="w-5 h-5">search</mat-icon>
    </span>
    <input type="text" (click)="onSearchFocusEvent()" (focus)="onSearchFocusEvent()"
      class="w-full bg-slate-100 border-none rounded-xl py-2 pl-10 focus:ring-2 focus:ring-indigo-600 transition-all text-sm"
      placeholder="Buscar el juguete perfecto...">
  </div>

  @if (isSearchOpen()) {
  <div
    class="absolute top-full left-0 w-full mt-2 bg-white rounded-2xl shadow-2xl border border-slate-100 z-50 overflow-hidden animate-fade-in-down">
    <div class="p-3">
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-3 mb-2">Sugerencias</p>

      <div class="space-y-1">
        @for (item of (searchResults() || []); track $index) {
        <div class="flex items-center gap-4 p-3 hover:bg-indigo-50 rounded-xl cursor-pointer transition-colors group">
          <div
            class="w-12 h-12 bg-slate-100 rounded-lg flex items-center justify-center text-2xl group-hover:bg-white transition-colors">
            {{ item.img }}
          </div>
          <div class="flex-1">
            <h4 class="text-sm font-semibold text-slate-800">{{ item.name }}</h4>
            <p class="text-xs text-slate-500">{{ item.category }}</p>
          </div>
          <div class="text-sm font-bold text-indigo-600">
            ${{ item.price }}
          </div>
        </div>
        }
      </div>
    </div>

    <div class="bg-slate-50 p-3 border-t border-slate-100">
      <button class="w-full text-center text-xs font-bold text-indigo-600 hover:text-indigo-800 transition-colors">
        Ver todos los resultados para "{{ searchQuery }}"
      </button>
    </div>
  </div>
  }
</div>
