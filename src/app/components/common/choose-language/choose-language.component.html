<div class="relative">
  <select [value]="activeLang()" (change)="changeLanguageEvent($event)"
    class="block w-full cursor-pointer rounded-lg border border-slate-200 bg-white px-4 py-2 pr-10 text-sm font-medium text-slate-700 shadow-sm transition-all hover:border-blue-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 focus:outline-hidden appearance-none">
    @for (item of availableLangs; track item.id) {
      <option [value]="item.id">{{ item.label }}</option>
    }
  </select>

  <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </div>
</div>
