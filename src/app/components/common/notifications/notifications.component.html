<div *transloco="let t" class="relative" #notifContainer>
  <button (click)="toggleNotificationsEvent()"
    class="p-2 text-slate-500 hover:bg-slate-100 rounded-full relative transition-colors cursor-pointer">
    <mat-icon class="w-6 h-6">notifications</mat-icon>
    <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-pink-500 rounded-full border-2 border-white"></span>
  </button>

  @if (isNotificationsOpen()) {
  <div
    class="absolute right-0 mt-3 w-80 bg-white rounded-2xl shadow-2xl border border-slate-100 z-50 overflow-hidden animate-fade-in-down">
    <div class="p-4 border-b border-slate-50 flex justify-between items-center bg-slate-50/50">
      <h3 class="font-bold text-slate-900">{{ t('notificationSection.Notifications') }}</h3>
      <span class="text-xs font-medium text-indigo-600 cursor-pointer hover:underline">
        {{ t('notificationSection.Mark all as read') }}
      </span>
    </div>

    <div class="max-h-96 overflow-y-auto">
      @for(n of (notifications() || []); track n.id) {
      <div
        class="p-4 flex gap-4 hover:bg-slate-50 cursor-pointer transition-colors border-b border-slate-50 last:border-0">
        <div
          class="flex-shrink-0 w-10 h-10 bg-white rounded-xl shadow-sm border border-slate-100 flex items-center justify-center text-xl">
          {{ n.icon }}
        </div>
        <div class="flex-1">
          <p class="text-sm text-slate-800 leading-tight" [ngClass]="{'font-bold': !n.read}">
            {{ n.text }}
          </p>
          <span class="text-xs text-slate-400 mt-1 block">{{ n.time }}</span>
        </div>
        @if (!n.read) {
        <div class="w-2 h-2 bg-indigo-500 rounded-full mt-2"></div>
        }
      </div>
      }
    </div>

    <a href="#"
      class="block p-3 text-center text-sm font-semibold text-slate-600 bg-slate-50 hover:text-indigo-600 transition-colors">
      {{ t('notificationSection.View all notifications') }}
    </a>
  </div>
  }
</div>
