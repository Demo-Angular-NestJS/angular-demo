<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
  @for (item of items(); track item.id) {
  <div class="group flex flex-col bg-white rounded-[2.5rem] border border-slate-100 shadow-sm hover:shadow-xl transition-all duration-300"
    [ngClass]="{'!bg-slate-50/50 !border !border-dashed !border-slate-200': !item.toy.inStock}">
    <div class="relative h-48 sm:h-56 md:h-64 m-3 overflow-hidden rounded-[2rem] bg-gradient-to-br from-indigo-50 to-white flex items-center justify-center">
      <img class="w-full h-full object-cover transform group-hover:scale-110 group-hover:rotate-3 transition-transform duration-500"
        [src]="item.toy.imageUrl" [alt]="item.toy.name"/>

      @if (item.toy.inStock) {
      <button class="absolute top-3 right-3 p-3 pb-1 bg-white/90 backdrop-blur-md rounded-2xl text-pink-500 shadow-md hover:bg-pink-500 hover:text-white transition-all active:scale-90 cursor-pointer"
        (click)="toggleFavoriteEvent(item.toy)">
        <mat-icon class="!w-5 h-5" svgIcon="heart"></mat-icon>
      </button>
      } @else {
      <div class="absolute inset-0 bg-slate-900/10 flex items-center justify-center">
        <span
          class="bg-white/90 px-4 py-2 rounded-xl text-xs font-black text-slate-600 shadow-sm border border-slate-200">
          AGOTADO
        </span>
      </div>
      }
    </div>

    <div class="p-5 md:p-7 pt-2 flex flex-col flex-grow">
      <div class="w-full" [ngClass]="{'!opacity-60': !item.toy.inStock}">
        <div class="flex justify-between items-start gap-2 mb-2">
          <h3 class="text-lg md:text-xl font-black text-slate-900 leading-tight group-hover:text-indigo-600 transition-colors cursor-pointer">
            <a [routerLink]="[searchToyDetailRoute, item.toyId]">
              {{ item.toy.name}}
            </a>
          </h3>
          <span class="text-xl md:text-2xl font-black text-indigo-600">${{ item.toy.price }}</span>
        </div>
        <p class="text-sm md:text-base text-slate-500 line-clamp-2 mb-6">
          {{ item.toy.shortDescription }}
        </p>
      </div>
      <div class="mt-auto">
        @if (item.toy.inStock) {
        <button class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold text-sm md:text-base hover:bg-indigo-600 shadow-lg transition-all active:scale-[0.97] cursor-pointer">
          Add to cart
        </button>
        } @else {
        <button class="w-full bg-white border-2 border-slate-200 text-slate-500 py-4 rounded-2xl font-bold text-sm md:text-base hover:bg-slate-800 hover:text-white hover:border-slate-800 transition-all cursor-pointer">
          Notify me when coming soon
        </button>
        }
      </div>
    </div>
  </div>
  }
</div>
