<form [formGroup]="form" autocomplete="off" class="flex flex-wrap justify-end gap-3 w-full lg:w-auto">
  <div class="relative w-2/3 flex-none sm:flex-1 lg:flex-none lg:w-80 group">
    <span
      class="absolute inset-y-0 left-4 flex items-center text-slate-400 group-focus-within:text-indigo-600 transition-colors">
      <mat-icon class="!w-5 !h-5">search</mat-icon>
    </span>
    <input type="text"
      class="w-full bg-white border-2 border-slate-100 rounded-2xl py-3 pl-11 pr-4 focus:ring-4 focus:ring-indigo-50 focus:border-indigo-600 transition-all text-base md:text-sm font-medium outline-none placeholder:text-slate-400"
      placeholder="What toy are you looking for?" formControlName="name">
  </div>

  <button type="button" (click)="toggleFiltersEvent()" [class.bg-indigo-600]="isFilterOpen()"
    class="bg-slate-900 text-white px-4 md:px-6 py-3 rounded-2xl font-bold hover:bg-indigo-700 transition-all flex items-center justify-center gap-2 shadow-lg shadow-slate-200 active:scale-95 cursor-pointer">
    <mat-icon class="!w-6 !h-6 !md:w-5 !md:h-5" svgIcon="preferences"></mat-icon>
    <span class="hidden sm:inline">Filters</span>
  </button>

  @if (isFilterOpen()) {
  <div class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-4">
    <button class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" (click)="toggleFiltersEvent()">
    </button>

    <div
      class="relative bg-white w-full max-w-md rounded-[2rem] sm:rounded-[2.5rem] p-6 md:p-8 shadow-2xl animate-in fade-in slide-in-from-bottom-8 sm:zoom-in-95 duration-300 max-h-[90vh] overflow-y-auto">

      <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6 sm:hidden"></div>

      <div class="flex justify-between items-center mb-8">
        <div>
          <h2 class="text-xl md:text-2xl font-black text-slate-900">Filter Settings</h2>
          <p class="text-xs text-slate-400 font-bold uppercase tracking-tighter">Personalize your search</p>
        </div>
        <button type="button" (click)="toggleFiltersEvent()"
          class="p-2 bg-slate-50 hover:bg-red-50 hover:text-red-500 rounded-xl transition-all cursor-pointer">
          <mat-icon class="!w-6 !h-6">close</mat-icon>
        </button>
      </div>

      <div class="space-y-8">
        <section>
          <div class="flex justify-between items-center mb-4">
            <label class="text-[10px] font-black uppercase tracking-widest text-slate-400">Price Range</label>
            <span class="text-indigo-600 font-bold text-sm">${{form.get('price')?.value || 0}}</span>
          </div>
          <input type="range" formControlName="price" min="0" max="2000"
            class="w-full h-2 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-indigo-600">
          <div class="flex justify-between mt-3 text-[11px] font-black text-slate-400">
            <span>$0</span>
            <span>2000+</span>
          </div>
        </section>

        <section>
          <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-4 block">Recommended Age</label>
          <div class="grid grid-cols-2 gap-3">
            @for (cat of categories(); track cat.id) {
            <button type="button" class="py-3 rounded-2xl border-2 border-slate-50 text-sm font-bold text-slate-600 hover:border-slate-200 transition-all active:scale-95 cursor-pointer"
              [ngClass]="{ '!border-indigo-600 !text-indigo-600 !bg-indigo-50': field('minAge').value === cat.minAge && field('maxAge').value === cat.maxAge }"
              (click)="selectAgeEvent(cat)">
              {{cat.minAge}} - {{cat.maxAge}} Years
            </button>
            }
          </div>
        </section>

        <div class="flex gap-3 pt-4">
          <button type="button"
            class="flex-1 py-4 text-sm font-bold text-slate-400 hover:text-slate-600 transition-colors cursor-pointer"
            (click)="form.reset()">
            Clear Filters
          </button>
        </div>
      </div>
    </div>
  </div>
  }
</form>
