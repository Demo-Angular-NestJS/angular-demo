<div
  class="group bg-white rounded-[2rem] border border-slate-200 overflow-hidden hover:shadow-xl hover:shadow-indigo-100 transition-all duration-300 flex flex-col">
  <div class="relative aspect-square xs:aspect-[4/3] sm:h-48 md:h-56 bg-slate-100 overflow-hidden">
    <img [src]="toyData().imageUrl" [alt]="toyData().name"
      class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">

    <div class="absolute top-3 left-3">
      <span
        class="bg-white/95 backdrop-blur-sm text-indigo-600 px-2.5 py-1 rounded-lg text-[10px] md:text-xs font-black shadow-sm uppercase tracking-wider">
        {{ toyData().categoryId | lookupMap:categoryMap()}}
      </span>
    </div>

    <button
      class="absolute top-3 right-3 p-2.5 bg-white/95 backdrop-blur-sm rounded-full text-slate-400 hover:text-pink-500 active:scale-125 transition-all">
      <mat-icon class="w-5 h-5" svgIcon="heart"></mat-icon>
    </button>
  </div>

  <div class="p-5 flex-1 flex flex-col">
    <div class="mb-2">
      <h3 class="font-bold text-slate-900 text-base md:text-lg leading-tight line-clamp-1">
        <a class="hover:text-indigo-700 cursor-pointer" [routerLink]="[searchToyDetailRoute, toyData().id]">{{ toyData().name }}</a>
      </h3>
    </div>
    <p class="text-slate-500 text-xs md:text-sm mb-4 line-clamp-2">{{ toyData().shortDescription }}</p>

    <div class="mt-auto flex items-center justify-between pt-4 border-t border-slate-50">
      <div>
        <p class="text-[10px] text-slate-400 uppercase font-black tracking-widest">Precio</p>
        <p class="text-lg md:text-xl font-black text-indigo-600">{{ toyData().price | currency:'USD' }}</p>
      </div>
      <button
        class="w-11 h-11 md:w-12 md:h-12 bg-slate-900 text-white rounded-xl md:rounded-2xl flex items-center justify-center hover:bg-indigo-600 transition-all shadow-lg active:scale-90">
        <mat-icon class="w-6 h-6" svgIcon="plus"></mat-icon>
      </button>
    </div>
  </div>
</div>
